<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediCare+ | Advanced Healthcare & Diagnostics</title>
    <meta name="description" content="World-class healthcare and diagnostics. Book appointments with expert doctors, get comprehensive health check-ups, and access 24/7 emergency care." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("load", () => {
        const contactForm = document.querySelector("#contactForm");
    
        if (contactForm) {
          contactForm.addEventListener("submit", async (e) => {
            e.preventDefault();
    
            const formData = {
              name: document.querySelector("#name") ? document.querySelector("#name").value : "",
              email: document.querySelector("#email") ? document.querySelector("#email").value : "",
              phone: document.querySelector("#phone") ? document.querySelector("#phone").value : "",
              message: document.querySelector("#message") ? document.querySelector("#message").value : "",
            };
    
            try {
              // Adjust port to 5001 if you updated PORT in .env earlier
              const response = await fetch("http://localhost:5001/api/contact", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData),
              });
    
              const result = await response.json();
    
              if (result.success) {
                alert("✅ " + result.message);
                contactForm.reset();
              } else {
                alert("❌ " + result.message);
              }
            } catch (err) {
              console.error(err);
              alert("❌ Failed to connect to server.");
            }
          });
        }
      });
    </script>
  </body>
</html>
